[package]
name = "kylinpaste"
version = "1.3.1"
license = "MIT"
description = "麒麟桌面剪贴板历史管理工具"
authors = ["ryan"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
# window-start-dragging:无标题栏窗口靠 data-tauri-drag-region 拖动
# protocol-asset:前端用 asset:// 协议加载本地图片缩略图(见 tauri.conf.json 的 assetScope)
# 这两个能力在 v1 里都由 allowlist 的编译期开关控制,配置与 features 必须一致
tauri = { version = "1.8", features = [ "macos-private-api", "global-shortcut", "window-start-dragging", "protocol-asset", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 剪贴板监听/读写(Linux X11 / macOS)
clipboard-rs = "0.3.5"
# 键盘模拟(粘贴 Ctrl+V,Linux 用 x11rb/XTEST,无需 libxdo)
enigo = "0.6.1"
once_cell = "1.18"
sha2 = "0.10"
# png 用于我们自己的落盘;jpeg/gif/bmp/webp/tiff 用于解码"被复制的图片文件"和剪贴板兜底格式
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }
dirs = "5.0"
parking_lot = "0.12"

# X11 底层能力:全局热键抓键、焦点归还、XTEST 注入 Ctrl+V(见 src/x11.rs)
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }

# NSWorkspace.frontmostApplication:读"复制时前台应用名"当来源(见 src/appinfo.rs)
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
# macOS 开机自启:加入"登录项"(系统设置→通用→登录项),Linux 侧仍用手写 XDG autostart
auto-launch = "0.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
panic = "abort"
