[package]
name = "kylinpaste"
version = "0.1.0"
description = "麒麟桌面剪贴板历史管理工具"
authors = ["ryan"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.8", features = ["system-tray", "global-shortcut"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 剪贴板监听/读写(Linux X11 / macOS)
clipboard-rs = "0.3.5"
# 键盘模拟(粘贴 Ctrl+V,Linux 用 x11rb/XTEST,无需 libxdo)
enigo = "0.6.1"
once_cell = "1.18"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "5.0"
parking_lot = "0.12"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
panic = "abort"
