name: Build (deb / dmg)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# 两个平台各一个 job:Linux 目标机出 deb,开发/预览用的 mac(M 系列)出 dmg
jobs:
  # ---------------------------------------------------------------- Linux(麒麟)
  build-deb:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend (vite)
        run: npm run build

      # cargo 缓存(容器内外共享目录)
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/cargo/registry
            .ci-cache/cargo/git
            src-tauri/target
          key: cargo-arm64-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-arm64-

      - name: Build focal build image
        run: docker build -t kylinpaste-build -f docker/Dockerfile.build docker/

      - name: Build binary in focal container
        run: |
          mkdir -p .ci-cache/cargo/registry .ci-cache/cargo/git
          docker run --rm \
            -v "$PWD:/work" \
            -v "$PWD/.ci-cache/cargo/registry:/root/.cargo/registry" \
            -v "$PWD/.ci-cache/cargo/git:/root/.cargo/git" \
            kylinpaste-build \
            cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Package deb
        run: |
          chmod +x scripts/package-deb.sh
          ./scripts/package-deb.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kylinpaste-arm64-deb
          path: dist-deb/*.deb

      # 打 tag(v*)时创建 GitHub Release 并附上 deb
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-deb/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------- macOS(M 系列)
  build-dmg:
    runs-on: macos-14 # Apple Silicon(M 系列),无需交叉编译
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-macos-arm64-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-macos-arm64-

      - name: Install frontend deps
        run: npm ci

      # --bundles 覆盖 tauri.conf.json 里的 targets(那边是给 Linux 的 deb 用的)
      # 产物:src-tauri/target/release/bundle/{macos/KylinPaste.app,dmg/KylinPaste_*.dmg}
      - name: Build app + dmg (arm64)
        run: npx tauri build --bundles app,dmg

      - name: Show artifacts
        run: |
          ls -lh src-tauri/target/release/bundle/macos/ || true
          ls -lh src-tauri/target/release/bundle/dmg/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kylinpaste-macos-arm64-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

      # tag 时把 dmg 一起附到同一个 Release(不重复生成 release notes)
      - name: Attach dmg to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
